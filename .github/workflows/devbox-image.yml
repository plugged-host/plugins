# Builds the devbox image (plugged-host-devbox/image/Dockerfile, ph's tests run inside the build)
# and publishes it to ghcr.io/plugged-host/devbox: a moving tag per release line (2.2), which
# the devbox egg uses, and an immutable one per commit (2.2.0.<sha>).
name: devbox image

on:
  push:
    branches: [main, '2.2']
    paths:
      - 'plugged-host-devbox/ph/**'
      - 'plugged-host-devbox/image/**'
      - '.github/workflows/devbox-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devbox-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: meta
        run: |
          release="$(tr -d '[:space:]' < VERSION)"
          echo "version=${release}.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "line=$(echo "$release" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: plugged-host-devbox
          file: plugged-host-devbox/image/Dockerfile
          build-args: PH_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: |
            ghcr.io/plugged-host/devbox:${{ steps.meta.outputs.line }}
            ghcr.io/plugged-host/devbox:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/plugged-host/plugins
            org.opencontainers.image.description=plugged.host devbox: VS Code on the server
          cache-from: type=gha
          cache-to: type=gha,mode=max
