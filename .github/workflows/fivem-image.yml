# Builds the FiveM image (plugged-host-fivem/image/Dockerfile; fivem-runtime's tests run inside the
# build) and publishes it to ghcr.io/plugged-host/fivem: a moving tag per release line (2.2), which
# the cfx eggs use (php artisan plugged-host:fivem-setup), and an immutable one per commit
# (2.2.0.<sha>). Nodes pull it without credentials, so the package must be public.
name: fivem image

on:
  push:
    branches: [main, '2.2']
    paths:
      - 'plugged-host-fivem/image/**'
      - '.github/workflows/fivem-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fivem-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: meta
        run: |
          release="$(tr -d '[:space:]' < VERSION)"
          echo "version=${release}.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "line=$(echo "$release" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: plugged-host-fivem
          file: plugged-host-fivem/image/Dockerfile
          push: true
          tags: |
            ghcr.io/plugged-host/fivem:${{ steps.meta.outputs.line }}
            ghcr.io/plugged-host/fivem:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/plugged-host/plugins
            org.opencontainers.image.description=plugged.host FiveM: keeps a server's FXServer artifact on the build and edition it asks for
          cache-from: type=gha
          cache-to: type=gha,mode=max
